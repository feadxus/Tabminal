name: Publish Docker image

on:
  workflow_dispatch:

jobs:
  # 🎯 核心:多架构矩阵并行构建(amd64 和 arm64)
  build:
    name: Build(${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch_suffix: amd64
          - platform: linux/arm64
            arch_suffix: arm64

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # 🧹 清理 Runner 上无用的软件包以腾出 20G+ 磁盘空间
      - name: Free Disk Space(Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 🛠️ 在工作目录下生成 Buildkit 配置文件
      - name: Prepare Buildkit Config
        run: |
          cat <<EOF > ./buildkitd.toml
          [dns]
            nameservers = ["1.1.1.1", "8.8.8.8"]
          EOF

      # 🛠️ 使用正确的 buildkitd-config 参数指定配置文件
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config: ./buildkitd.toml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve npm package artifact
        id: npm
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          target_version="$current_version"

          if [[ "$EVENT_NAME" == "push" && "$REF" =~ ^refs/heads/(main|master)$ ]]; then
            IFS='.' read -r major minor patch <<<"$current_version"
            target_version="$major.$minor.$((patch + 1))"
          elif [[ "$EVENT_NAME" == "push" && "$REF" =~ ^refs/tags/v(.+)$ ]]; then
            target_version="${BASH_REMATCH[1]}"
          elif [[ "$EVENT_NAME" == "release" && -n "${RELEASE_TAG:-}" ]]; then
            target_version="${RELEASE_TAG#v}"
          fi

          package_spec="https://registry.npmjs.org/tabminal/-/tabminal-${target_version}.tgz"

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          echo "package_spec=$package_spec" >> "$GITHUB_OUTPUT"

      - name: 创建 rclone 配置
        env:
          RCLONE_CONFIG_1: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
          RCLONE_CONFIG_2: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
        run: |
          printf '%s\n' "$RCLONE_CONFIG_1" > rclone.conf
          printf '%s\n' "$RCLONE_CONFIG_2" >> rclone.conf
          chmod 600 rclone.conf

      - name: Wait for npm package artifact
        shell: bash
        env:
          TARGET_VERSION: ${{ steps.npm.outputs.target_version }}
          PACKAGE_SPEC: ${{ steps.npm.outputs.package_spec }}
        run: |
          set -euo pipefail
          echo "Waiting for tabminal@$TARGET_VERSION"
          echo "Expecting artifact: $PACKAGE_SPEC"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Workflow dispatched manually. Using default npm spec: tabminal"
            exit 0
          fi

          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -I "$PACKAGE_SPEC" || true)"
            if [[ "$status" == "200" ]]; then
              echo "Artifact is available"
              exit 0
            fi
            echo "Attempt $attempt/12: status=$status; sleeping 10s"
            sleep 10
          done
          echo "Warning: Artifact not found on npm, falling back to latest npm package."

      # 🚀 独立构建并推送当前架构的镜像
      - name: Build and push per-architecture Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            TABMINAL_NPM_SPEC=${{ github.event_name == 'workflow_dispatch' && 'tabminal' || steps.npm.outputs.package_spec }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tabminal:latest-${{ matrix.arch_suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 🔗 收尾 Job:等待 amd64 和 arm64 构建完成后,将其合并为标准的 Multi-arch Manifest
  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Create and push Multi-arch Manifest
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/tabminal"
          
          echo "=== 正在将 amd64 和 arm64 镜像合并为 latest ==="
          docker buildx imagetools create \
            --tag ${IMAGE_NAME}:latest \
            ${IMAGE_NAME}:latest-amd64 \
            ${IMAGE_NAME}:latest-arm64

          echo "=== 校验最终的多架构清单 ==="
          docker buildx imagetools inspect ${IMAGE_NAME}:latest
