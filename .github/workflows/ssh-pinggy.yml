
name: SSH via Pinggy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install OpenSSH Server
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_PUBLIC_KEY" ]]; then
            echo "Missing SSH_PUBLIC_KEY repository secret"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Create a dedicated, non-root SSH account.
          sudo useradd -m -s /bin/bash remote

          sudo install -d -m 700 -o remote -g remote \
            /home/remote/.ssh

          printf '%s\n' "$SSH_PUBLIC_KEY" |
            sudo tee /home/remote/.ssh/authorized_keys >/dev/null

          sudo chown remote:remote \
            /home/remote/.ssh/authorized_keys
          sudo chmod 600 \
            /home/remote/.ssh/authorized_keys

          # SSH listens on port 1234; public-key authentication only.
          sudo tee /etc/ssh/sshd_config.d/99-remote.conf >/dev/null <<'EOF'
          Port 1234
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowUsers remote
          EOF

          sudo /usr/sbin/sshd -t
          sudo systemctl restart ssh

          echo "SSH server started on port 1234"

      - name: Start Pinggy TCP Tunnel
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Pinggy TCP tunnel..."
          echo "Watch the output below for the public TCP address."
          echo "Connect as: ssh -i ~/.ssh/id_ed25519 -p PORT remote@HOST"

          exec ssh -T \
            -p 443 \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R0:localhost:1234 \
            tcp@free.pinggy.io
