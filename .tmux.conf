# 📦 启用并配置 tmux 插件
set -g @plugin 'tmux-plugins/tpm'                                                               # 🛠️ Tmux 插件管理器 TPM
set -g @plugin 'catppuccin/tmux'                                                                # 🎨 Catppuccin 主题插件
set -g @plugin 'dreknix/tmux-primary-ip'                                                        # 🌐 状态栏显示主机 IP 地址
set -g @plugin 'alexwforsythe/tmux-which-key'                                                   # 💡 显示快捷键提示 (Prefix + Space)
set -g @plugin 'tmux-plugins/tmux-yank'                                                         # 📋 启用 tmux-yank 插件
set -g @plugin 'tmux-plugins/tmux-sensible'                                                     # ⚙️ Tmux Sensible 通用优化


# ⚙️ 基本配置
setw -g mode-keys vi                                                                            # ⌨️ 设置使用 vi 编辑器风格按键
set -g mouse 'on'                                                                               # 🖱️ 启用鼠标支持 (缩放/选择/切换)
set -g base-index '1'                                                                           # 🔢 窗口编号从 1 开始
set -g pane-base-index '1'                                                                      # 🔢 窗格编号从 1 开始
set -g display-panes-time '10000'                                                               # ⏳ 显示窗格编号的时间
set -g automatic-rename off                                                                     # 🚫 禁用内部自动改名(Tmux 不会根据你运行的程序如 vim/top 自动换名)
set -g allow-rename off                                                                         # 🚫 禁用外部强制改名(防止 Fish Shell 或脚本通过转义字符强行修改窗口名)

setw -g aggressive-resize on                                                                    # 📐 强制所有窗口跟随当前客户端大小
set -g window-size latest                                                                       # 📐 确保窗口大小设置为最新活动客户端
set -g default-terminal "xterm-256color"                                                        # 📺 开启真彩支持
set -ga terminal-overrides ",xterm-256color:Tc"                                                 # 🎨 开启 24-bit 真彩显示,防止 oh-my-posh 颜色排版错误
set-option -g set-titles on                                                                     # 🏷️ 自动修改终端窗口标题
                                                                                                # 🚀 当前窗口弹出一个非常漂亮的浮窗界面
set -g @plugin 'omerxx/tmux-sessionx'                                                           # 🗃️ 终端窗口快速切换
set -g @sessionx-bind 't'                                                                       # 💡 使用方法: Ctrl + f 然后按 t,弹出后台后选择窗口回车切换
source-file $HOME/.tmux/catppuccin.conf                                                         # 🌈 加载 Catppuccin 主题配置


# 在文件底部初始化 TPM
run -b "$HOME/.tmux/plugins/tpm/tpm"                                                            # 🚀 初始化 TPM 插件管理器
