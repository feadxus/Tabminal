bind o source-file "$HOME/.tmux.conf" \; display-message "配置已重新加载.."                       # 🔄 重新加载配置的快捷键
                                                                                                # 💡 修改后按 Ctrl + f 然后按 o (自动重载)
set -g default-command "fish --login"                                                           # 🐚 加载 fish shell 的 config.fish 配置 (解决窗口主题加载)
unbind-key -a                                                                                   # 🗑️ 清空所有默认按键


# ⌨️ 控制开关
#set -g prefix C-f                                                                              # ⚠️🍎 macOS使用:启动按键设定: Ctrl+F (默认值: Ctrl+B)
set -g prefix C-g                                                                               # ⚠️🐧 Linux使用:启动按键设定: Ctrl+G (默认值: Ctrl+B)


# 📏 调整面板大小 (使用 WASD 风格)
# 操作方法:按下 Ctrl + f 后,直接按 w, a, s, d (支持连按,因为有 -r 参数)
bind -r w resizep -U 2                                                                          # 🔼 Ctrl+f 然后按 i 增加面板高度
bind -r s resizep -D 2                                                                          # 🔽 Ctrl+f 然后按 k 减小面板高度
bind -r a resizep -L 2                                                                          # ◀️ Ctrl+f 然后按 j 增加面板宽度 (原为 -R 减小,已按 WASD 直觉对齐)
bind -r d resizep -R 2                                                                          # ▶️ Ctrl+f 然后按 l 减小面板宽度 (原为 -L 增加,已按 WASD 直觉对齐)


# 🪟 窗口分割
bind '-' split-window -v -c "#{pane_current_path}"                                              # ➖ Ctrl+f 然后按 - 水平创建一个窗口
bind '=' split-window -h -c "#{pane_current_path}"                                              # 🥅 Ctrl+f 然后按 = 垂直创建一个窗口


# 🎯 面板切换
bind -r Left  select-pane -L                                                                    # ⬅️ Ctrl+f 然后按方向键左选择左侧面板
bind -r Down  select-pane -D                                                                    # ⬇️ Ctrl+f 然后按方向键下选择下侧面板
bind -r Up    select-pane -U                                                                    # ⬆️ Ctrl+f 然后按方向键上选择上侧面板
bind -r Right select-pane -R                                                                    # ➡️ Ctrl+f 然后按方向键右选择右侧面板


# 🖥️ 工作区管理
bind , new-session                                                                              # ✨ 新建"工作空间"
bind . previous-window                                                                          # 📎 切换至上一个窗口
bind / next-window                                                                              # 📎 切换至下一个窗口

# 📑 任务栏标签页管理
bind 'c' new-window -c "#{pane_current_path}"                                                   # 🆕 在"工作空间"里新开"标签页"并继承当前命令行所在路径
bind -r '3' next-window                                                                         # ⏭️ Ctrl+f 然后按 3 切换到下一个窗口
bind -r '2' previous-window                                                                     # ⏮️ Ctrl+f 然后按 2 切换到上一个窗口
bind '1' select-window -t :1                                                                    # 🎯 Ctrl+f 然后按 1 切换到第 1 个窗口


# 📖 vi 编辑器模式复制快捷键
bind v copy-mode                                                                                # 🔍 Ctrl+f 然后按 v 访问"查看/复制模式"
bind -T copy-mode-vi x send -X begin-selection                                                  # ✂️ Ctrl+f 然后按访问模式
                                                                                                # 1️⃣ 用方向键或 h/j/k/l 自由移动光标定位起点
                                                                                                # 2️⃣ 按下 x 开始框选
                                                                                                # 3️⃣ 选好后,按下 c 复制
bind 'w' list-windows                                                                           # 📋 快速查看所有窗口列表 (Ctrl+f -> w)


# ⚠️📖 提取框选内容并(复制到系统剪切板)
#bind -T copy-mode-vi m send -X copy-selection \; \
#        run "tmux show-buffer | pbcopy"                                                        # 📋 Ctrl+f 然后按 m 提取并复制到 macOS 系统剪切板
bind -T copy-mode-vi l send -X copy-selection \; \
        run "tmux show-buffer | xclip -selection clipboard"                                     # 📋 Ctrl+f 然后按 l 提取并复制到 Linux 系统剪切板
bind b pasteb                                                                                   # 📥 Ctrl+f 然后按 'b' 粘贴剪贴板内容


bind d detach-client                                                                            # ⛓️‍💥 断开当前连接,保持 tmux 后台运行


